name: hyperactive
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Makes Hermes proactive: an objective tree (life > year > quarter > week), follow-ups, reminders and tap cards, delivered on Hermes's own cron schedule. Everything it does traces back to a goal."
author: Justin
license: MIT
requires_hermes: ">=0.22.5"
tags: [productivity, proactive, goals, cron]
provides_tools:
  - ha_goal_add
  - ha_followup
  - ha_status
config_schema:
  pulse_every: {type: str, default: "every 5m", description: "How often the pulse cron job checks for due items."}
  deliver: {type: str, default: "origin", description: "Where proactive messages go (cron deliver grammar, e.g. telegram, local)."}
  quiet_hours: {type: str, default: "", description: "Local window with no proactive messages, e.g. 22:00-07:00. Items are deferred, never dropped."}
